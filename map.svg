<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">نقشه‌ی سه‌بعدی دریای پارسی</title>
<desc id="desc">پنج جزیره‌ی شناور در دریایی جادویی با قلعه، کارخانه‌ی واژه‌ها، رصدخانه، شهر قصه‌ها و آزمایشگاه کیمیاگری.</desc>
<defs>
 <linearGradient id="sea" x2="0.9" y2="1"><stop stop-color="#18c9ed"/><stop offset=".48" stop-color="#079bd1"/><stop offset="1" stop-color="#32d5df"/></linearGradient>
 <radialGradient id="seaGlow"><stop stop-color="#39d9ed" stop-opacity=".38"/><stop offset=".55" stop-color="#386cbb" stop-opacity=".14"/><stop offset="1" stop-color="#091a3e" stop-opacity="0"/></radialGradient>
 <linearGradient id="islandTop" x2=".2" y2="1"><stop stop-color="#fff3c9"/><stop offset=".38" stop-color="#f6c978"/><stop offset="1" stop-color="#b87551"/></linearGradient>
 <linearGradient id="islandSide" x2="0" y2="1"><stop stop-color="#b98761"/><stop offset=".45" stop-color="#936044"/><stop offset="1" stop-color="#694632"/></linearGradient>
 <linearGradient id="iceEdge" x2="1" y2="1"><stop stop-color="#fff5d5"/><stop offset=".5" stop-color="#8be7e5"/><stop offset="1" stop-color="#55bfc8"/></linearGradient>
 <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".55" stop-color="#e9a94f"/><stop offset="1" stop-color="#bd713c"/></linearGradient>
 <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#c5ffff"/><stop offset=".55" stop-color="#48d7d4"/><stop offset="1" stop-color="#168eaa"/></linearGradient>
 <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff2a7"/><stop offset=".55" stop-color="#ffbf45"/><stop offset="1" stop-color="#e27a27"/></linearGradient>
 <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#ffd8ad"/><stop offset=".55" stop-color="#f6a17e"/><stop offset="1" stop-color="#d66b55"/></linearGradient>
 <linearGradient id="green" x2="1" y2="1"><stop stop-color="#d7ffb0"/><stop offset=".55" stop-color="#75ce65"/><stop offset="1" stop-color="#348b55"/></linearGradient>
 <radialGradient id="glowCyan"><stop stop-color="#7df7ff" stop-opacity=".8"/><stop offset="1" stop-color="#48d9ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowGold"><stop stop-color="#ffe89a" stop-opacity=".75"/><stop offset="1" stop-color="#ffbf55" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-50%" width="180%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
 <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
