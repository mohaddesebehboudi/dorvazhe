 <g id="crystal"><path d="M0 0 17 -38 34 0 17 28Z" fill="url(#cyan)" stroke="#d7ffff" stroke-width="2"/><path d="M17 -38V28" stroke="#fff" stroke-opacity=".6" stroke-width="2"/><path d="M0 0 17 8 34 0" fill="none" stroke="#fff" stroke-opacity=".55"/></g>
 <g id="tree"><path d="M0 5v27" stroke="#5a483f" stroke-width="7" stroke-linecap="round"/><circle cy="-3" r="20" fill="#54c98b" stroke="#c1ffd9" stroke-width="2"/><circle cx="-12" cy="5" r="12" fill="#80e7a2"/><circle cx="12" cy="5" r="12" fill="#36a978"/></g>
 <g id="star"><path d="M0 -9 2.5 -2.5 9 0 2.5 2.5 0 9 -2.5 2.5 -9 0 -2.5 -2.5Z" fill="#eaffff"/></g>
